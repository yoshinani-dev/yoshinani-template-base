name: Report Coverage

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed

jobs:
  report:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage artifact (PR)
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: coverage
          path: coverage

      - name: Find latest main coverage run
        id: main-coverage
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "test.yml",
              branch: "main",
              status: "completed",
              per_page: 20,
            })

            const run = data.workflow_runs.find(
              (item) => item.conclusion === "success",
            )

            if (!run) {
              core.setOutput("found", "false")
              return
            }

            core.setOutput("found", "true")
            core.setOutput("run-id", String(run.id))

      - name: Download coverage artifact (main)
        if: steps.main-coverage.outputs.found == 'true'
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.main-coverage.outputs.run-id }}
          name: coverage
          path: coverage-main

      - name: Report coverage (compare main)
        if: steps.main-coverage.outputs.found == 'true'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-summary-compare-path: coverage-main/coverage-summary.json
          json-final-path: coverage/coverage-final.json

      - name: Report coverage (no compare)
        if: steps.main-coverage.outputs.found != 'true'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
