name: Report Coverage

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed

jobs:
  report:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage artifact (PR)
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: coverage-${{ github.event.workflow_run.head_sha }}
          path: coverage

      - name: Get base SHA
        id: base-sha
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequests = context.payload.workflow_run.pull_requests ?? []
            const baseSha = pullRequests[0]?.base?.sha

            if (!baseSha) {
              core.setOutput("found", "false")
              return
            }

            core.setOutput("found", "true")
            core.setOutput("base-sha", baseSha)

      - name: Find main coverage artifact
        if: steps.base-sha.outputs.found == 'true'
        id: main-coverage
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ steps.base-sha.outputs.base-sha }}
        with:
          script: |
            const baseSha = process.env.BASE_SHA
            const { owner, repo } = context.repo
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner,
              repo,
              per_page: 100,
            })

            const artifact = data.artifacts.find(
              (item) => item.name === `coverage-${baseSha}`,
            )

            if (!artifact) {
              core.setOutput("found", "false")
              return
            }

            core.setOutput("found", "true")
            core.setOutput("artifact-id", String(artifact.id))

      - name: Download coverage artifact (main)
        if: steps.main-coverage.outputs.found == 'true'
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-ids: ${{ steps.main-coverage.outputs.artifact-id }}
          path: coverage-main

      - name: Report coverage (compare main)
        if: steps.main-coverage.outputs.found == 'true'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-summary-compare-path: coverage-main/coverage-summary.json
          json-final-path: coverage/coverage-final.json

      - name: Report coverage (no compare)
        if: steps.main-coverage.outputs.found != 'true'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
